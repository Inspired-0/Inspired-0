<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура DemoAnalysis</title>
  <desc id="desc">Данные встреч проходят получение и нормализацию, дедупликацию, структурированный LLM-анализ, проверку схемы и цитат. Состояние сохраняется в SQLite до доставки результата во внешние рабочие интерфейсы.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 28px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-copy { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .caption { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .support { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .telemetry { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
      .box { stroke-width: 1.5; rx: 16; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="64" y="62" class="title">DemoAnalysis: проверяемый путь от транскрипта до результата</text>
  <text x="64" y="91" class="subtitle">Состояние фиксируется до внешней доставки, а вывод модели проходит два независимых гейта</text>

  <path class="flow" d="M245 270 H295"/>
  <path class="flow" d="M515 270 H565"/>
  <path class="flow" d="M785 270 H835"/>
  <path class="flow" d="M1055 270 H1105"/>

  <rect class="box" x="55" y="210" width="190" height="120" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="150" y="249" class="node-title">Meeting providers</text>
  <text x="150" y="278" class="node-copy">метаданные</text>
  <text x="150" y="298" class="node-copy">и транскрипты</text>

  <rect class="box" x="295" y="195" width="220" height="150" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="405" y="238" class="node-title">Ingestion</text>
  <text x="405" y="260" class="node-title">+ normalization</text>
  <text x="405" y="290" class="node-copy">общая модель данных</text>
  <text x="405" y="310" class="node-copy">для разных контрактов</text>

  <rect class="box" x="565" y="195" width="220" height="150" fill="#ecfdf5" stroke="#34d399"/>
  <text x="675" y="238" class="node-title">Dedup + state machine</text>
  <text x="675" y="270" class="node-copy">идемпотентные фазы</text>
  <text x="675" y="290" class="node-copy">повтор без дублей</text>
  <text x="675" y="310" class="node-copy">и двойной оплаты</text>

  <rect class="box" x="835" y="195" width="220" height="150" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="945" y="238" class="node-title">Structured LLM</text>
  <text x="945" y="260" class="node-title">analysis</text>
  <text x="945" y="290" class="node-copy">типизированный ответ</text>
  <text x="945" y="310" class="node-copy">вместо свободного текста</text>

  <rect class="box" x="1105" y="195" width="135" height="150" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1172" y="238" class="node-title">Verify</text>
  <text x="1172" y="270" class="node-copy">schema</text>
  <text x="1172" y="290" class="node-copy">roles</text>
  <text x="1172" y="310" class="node-copy">quotes</text>

  <path class="support" d="M675 455 V355"/>
  <path class="flow" d="M1172 355 V420 H945 V455"/>
  <path class="flow" d="M785 520 H815"/>
  <path class="flow" d="M1065 520 H1110"/>

  <rect class="box" x="565" y="455" width="220" height="120" fill="#ffffff" stroke="#94a3b8"/>
  <text x="675" y="497" class="node-title">SQLite state</text>
  <text x="675" y="526" class="node-copy">статус и результат</text>
  <text x="675" y="546" class="node-copy">до внешней записи</text>

  <rect class="box" x="825" y="465" width="240" height="110" fill="#ffffff" stroke="#94a3b8"/>
  <text x="945" y="506" class="node-title">Result delivery</text>
  <text x="945" y="533" class="node-copy">upsert в рабочую таблицу</text>
  <text x="945" y="553" class="node-copy">без повторного анализа</text>

  <rect class="box" x="1120" y="465" width="120" height="110" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1180" y="503" class="node-title">Assistant</text>
  <text x="1180" y="530" class="node-copy">вопросы к</text>
  <text x="1180" y="550" class="node-copy">результатам</text>

  <path class="telemetry" d="M195 625 H1180"/>
  <path class="telemetry" d="M405 625 V355"/>
  <path class="telemetry" d="M945 625 V585"/>
  <path class="telemetry" d="M1180 625 V585"/>

  <rect x="55" y="600" width="140" height="50" rx="12" fill="#e2e8f0"/>
  <text x="125" y="621" class="node-title">Logs + metrics</text>
  <text x="125" y="641" class="node-copy">ошибки и стоимость</text>

  <rect x="55" y="666" width="1185" height="36" rx="10" fill="#e2e8f0"/>
  <text x="78" y="690" class="caption">Инвариант: статус успеха появляется только после валидации результата и подтверждённой внешней записи.</text>
</svg>
