<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура SocialBot</title>
  <desc id="desc">Запрос пользователя поступает в агентный цикл. Модель предлагает действие, policy-слой проверяет его перед выполнением браузерным адаптером. Skills, квоты, аккаунты и журнал событий образуют отдельные контролируемые контуры.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 28px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-copy { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .caption { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .support { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .box { stroke-width: 1.5; rx: 16; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="64" y="62" class="title">SocialBot: LLM предлагает, policy разрешает, адаптер исполняет</text>
  <text x="64" y="91" class="subtitle">Вероятностное планирование отделено от внешнего эффекта и состояния аккаунта</text>

  <path class="flow" d="M240 270 H300"/>
  <path class="flow" d="M520 270 H575"/>
  <path class="flow" d="M795 270 H850"/>
  <path class="flow" d="M1070 270 H1125"/>

  <rect class="box" x="60" y="210" width="180" height="120" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="150" y="255" class="node-title">CLI / локальный API</text>
  <text x="150" y="282" class="node-copy">задача пользователя</text>
  <text x="150" y="302" class="node-copy">и подтверждения</text>

  <rect class="box" x="300" y="210" width="220" height="120" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="410" y="255" class="node-title">Agent loop</text>
  <text x="410" y="282" class="node-copy">контекст, шаги,</text>
  <text x="410" y="302" class="node-copy">условия остановки</text>

  <rect class="box" x="575" y="210" width="220" height="120" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="685" y="255" class="node-title">LLM + tool calling</text>
  <text x="685" y="282" class="node-copy">структурированное</text>
  <text x="685" y="302" class="node-copy">предложение действия</text>

  <rect class="box" x="850" y="195" width="220" height="150" fill="#fff7ed" stroke="#fb923c"/>
  <text x="960" y="240" class="node-title">Policy + confirmations</text>
  <text x="960" y="267" class="node-copy">permissions · risk</text>
  <text x="960" y="287" class="node-copy">quota · idempotency</text>
  <text x="960" y="307" class="node-copy">human approval</text>

  <rect class="box" x="1125" y="210" width="115" height="120" fill="#ecfdf5" stroke="#34d399"/>
  <text x="1182" y="250" class="node-title">Browser</text>
  <text x="1182" y="271" class="node-title">adapter</text>
  <text x="1182" y="299" class="node-copy">внешний</text>
  <text x="1182" y="317" class="node-copy">эффект</text>

  <path class="support" d="M410 465 V340"/>
  <path class="support" d="M685 465 V340"/>
  <path class="support" d="M960 465 V355"/>
  <path class="support" d="M1125 540 H1088 C1055 540 1055 330 1088 330 H1115"/>

  <rect class="box" x="300" y="465" width="220" height="110" fill="#ffffff" stroke="#94a3b8"/>
  <text x="410" y="506" class="node-title">Skills runner</text>
  <text x="410" y="533" class="node-copy">проверяемые playbooks</text>
  <text x="410" y="553" class="node-copy">с явными контрактами</text>

  <rect class="box" x="575" y="465" width="220" height="110" fill="#ffffff" stroke="#94a3b8"/>
  <text x="685" y="506" class="node-title">Scheduler + quotas</text>
  <text x="685" y="533" class="node-copy">окна запуска, лимиты,</text>
  <text x="685" y="553" class="node-copy">защита от повторов</text>

  <rect class="box" x="850" y="465" width="220" height="110" fill="#ffffff" stroke="#94a3b8"/>
  <text x="960" y="506" class="node-title">Redacted event log</text>
  <text x="960" y="533" class="node-copy">решения policy без</text>
  <text x="960" y="553" class="node-copy">сообщений и секретов</text>

  <rect class="box" x="1090" y="465" width="150" height="110" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1165" y="506" class="node-title">Account registry</text>
  <text x="1165" y="533" class="node-copy">явная изоляция</text>
  <text x="1165" y="553" class="node-copy">профилей</text>

  <rect x="60" y="626" width="1180" height="48" rx="12" fill="#e2e8f0"/>
  <text x="84" y="656" class="caption">Инвариант: ни один ответ модели сам по себе не является разрешением на отправку, публикацию или изменение аккаунта.</text>
</svg>
